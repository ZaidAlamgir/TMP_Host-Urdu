name: "Daily 24-Hour InfoLens Archival and D1 Sync (Urdu)"

on:
  schedule:
    - cron: '0 2 * * *' # Midnight 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-infolens-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout TMP_Host-Urdu (Scripts)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT || secrets.GITHUB_TOKEN }}
          path: ./main_site

      - name: 2. Checkout Urdu InfoLens Content Repo
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TMPnews-urdu/tmp-articles-infolens
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT || secrets.GITHUB_TOKEN }}
          path: ./infolens-repo
          fetch-depth: 1

      - name: 3. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Sync Older Urdu Infographics to D1 & Move to Archive
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '81e48888678bf5f5a99fbe2e42050e8a' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_INFOLENS_DATABASE_ID: ${{ secrets.D1_INFOLENS_URDU_DATABASE_ID || secrets.D1_INFOLENS_DATABASE_ID || '17214819-29df-41a5-97ab-8b4f63d86896' }}
        run: |
          if [ -d "./infolens-repo/posts" ]; then
            python3 ./main_site/scripts/archive_infolens_to_d1.py \
              --src ./infolens-repo/posts \
              --archive ./infolens-repo/archive \
              --days 60 \
              --language ur
          elif [ -d "./main_site/_infolens" ]; then
            python3 ./main_site/scripts/archive_infolens_to_d1.py \
              --src ./main_site/_infolens \
              --archive ./main_site/archive/infolens \
              --days 60 \
              --language ur
          fi

      - name: 5. Commit and Push Archived Urdu InfoLens Files
        run: |
          if [ -d "./infolens-repo/.git" ]; then
            cd ./infolens-repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add archive/
            git add -u posts/ 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "No Urdu infographics required archival today."
            else
              git commit -m "chore(infolens): archive Urdu infographics older than 60 days to D1 [skip ci]"
              git push origin main
            fi
          fi
