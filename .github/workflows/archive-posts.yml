name: "Daily 24-Hour Post Archival and D1 Sync (Urdu)"

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout TMP_Host-Urdu
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT || secrets.GITHUB_TOKEN }}
          path: ./main_site

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Run Urdu Archival & D1 Sync
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '81e48888678bf5f5a99fbe2e42050e8a' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || secrets.D1_DATABASE_ID_UR || '401a2479-db9b-4a79-a98f-593b71cbf843' }}
        run: |
          python3 ./main_site/scripts/archive_to_d1.py \
            --repo-dir ./main_site \
            --days 60 \
            --language ur

      - name: 3b. Reorganize Remote Org Category Repos (Move > 60d to archive/)
        env:
          GITHUB_PAT: ${{ secrets.GH_PAT_FOR_CHECKOUT || secrets.GITHUB_TOKEN }}
        run: |
          python3 ./main_site/scripts/reorganize_org_repos_to_archive.py --org TMPnews-urdu --days 60

      - name: 4. Commit and Push Archived Files
        run: |
          cd ./main_site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ archive/
          if git diff --staged --quiet; then
            echo "No older posts to archive today."
          else
            git commit -m "chore(archive): move Urdu posts older than 60 days to archive and D1 [skip ci]"
            git push origin main
          fi
