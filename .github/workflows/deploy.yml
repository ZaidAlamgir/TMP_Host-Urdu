name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [new-article-post]

permissions:
  contents: read
  deployments: write

# the Node 20 warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Main Repo (TMP_Host-Urdu)
        uses: actions/checkout@v4
        with:
          repository: zaidalamgir/TMP_Host-Urdu
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ./main_site

      - name: 2. Create Staging Directories
        run: |
          mkdir -p ./main_site/_posts
          mkdir -p ./_article_repos
        
      # --- CHECKOUT STEPS ---
      - name: 3. Checkout World Politics
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-world-politics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/world-politics

      - name: 4. Checkout Indian Politics
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-indian-politics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/indian-politics

      - name: 5. Checkout Muslim World
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-muslim-world
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/muslim-world

      - name: 6. Checkout Technology
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-technology
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/technology

      - name: 7. Checkout Medical Science
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-medical-science
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/medical-science

      - name: 8. Checkout Global Economy
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-global-economy
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/global-economy

      - name: 9. Checkout Art & Culture
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-art-culture
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/art-culture

      - name: 10. Checkout Weather
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-weather
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/weather

      - name: 11. Checkout Sports
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-sports
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/sports

      - name: 12. Checkout National News
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-national-news
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/national-news

      - name: 13. Checkout International News
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-international-news
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/international-news
      
      - name: 14. Checkout User Archives
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-user-archives
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-archives

      # --- NEW CHECKOUT STEPS ---
      - name: 15. Checkout History
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-history
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/history

      - name: 16. Checkout Indian Muslims
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-indian-muslims
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/indian-muslims

      - name: 17. Checkout Middle East
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-middle-east
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/middle-east

      - name: 18. Checkout Climate
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-climate
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/climate

      - name: 19. Checkout Defense
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-defense
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/defense

      - name: 20. Checkout South Asia
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-south-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-asia

      - name: 21. Checkout Africa
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-africa
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/africa

      - name: 22. Checkout Europe
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-europe
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/europe

      - name: 23. Checkout Central Asia
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-central-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/central-asia

      - name: 24. Checkout Crime Alert
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-crime-alert
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/crime-alert

      - name: 25. Checkout South East Asia
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-south-east-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-east-asia

      - name: 26. Checkout East Asia
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-east-asia
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/east-asia

      - name: 27. Checkout North America
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-north-america
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/north-america

      - name: 28. Checkout South America
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-south-america
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/south-america

      - name: 29. Checkout War
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-war
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/war

      - name: 30. Checkout Natural Disaster
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-natural-disaster
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/natural-disaster

      - name: 31. Checkout Palestine
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-palestine
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/palestine

      - name: 32. Checkout Strategic Deals
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-strategic-deals
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/strategic-deals

      - name: 33. Checkout Speeches & Press Conference
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-speeches-press-conference
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/speeches-press-conference

      - name: 34. Checkout Business & Economics
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-business-economics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/business-economics

      - name: 35. Checkout Space
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-space
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/space

      - name: 36. Checkout Wildlife
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-wild-life
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/wild-life

      - name: 37. Checkout Discoveries & Inventions
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-discoveries-and-inventions
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/discoveries-and-inventions

      - name: 38. Checkout Minorities
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-minorities
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/minorities

      - name: 39. Checkout Fact Check
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-fact-check
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/fact-check

      - name: 40. Checkout Analysis
        uses: actions/checkout@v4
        with:
          repository: TMPnews-urdu/tmp-articles-analysis
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/analysis

      # --- USER POSTS (POOLED WRITERS: 100 USERS PER REPO) ---
      - name: 40b. Checkout User Posts (Pool 1)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TMPnews-urdu/user-posts
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-posts

      - name: 40c. Checkout User Posts (Pool 2)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TMPnews-urdu/user-posts-02
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-posts-02

      # --- CONSOLIDATION (OPTION B: LAST 60 DAYS ONLY) ---
      - name: 41. Consolidate Active Posts (< 60 Days)
        run: |
          echo "--- Starting Option B Active Post Consolidation (< 60 Days) ---"
          mkdir -p ./main_site/_posts
          python3 ./main_site/scripts/consolidate_active_posts.py --src ./_article_repos --dest ./main_site/_posts --days 60
          echo "--- Active Posts in _posts for Jekyll build: ---"
          ls -1 ./main_site/_posts | wc -l
      
      - name: 42. Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./main_site 
          
      - name: 43. Build with Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --trace
        working-directory: ./main_site 

      # --- ASSET LINKS FIX ---
      - name: 43b. Setup AssetLinks Rewrite for Cloudflare
        run: |
          echo "Setting up AssetLinks Rewrite..."
          cp .well-known/assetlinks.json _site/assetlinks.json
          mkdir -p _site/.well-known
          cp .well-known/assetlinks.json _site/.well-known/
          echo "/.well-known/assetlinks.json /assetlinks.json 200" >> _site/_redirects
          echo "AssetLinks rewrite setup complete."
        working-directory: ./main_site
        
      - name: 44. Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: ./main_site/_site
          retention-days: 1

  # --- SEPARATE DEPLOY JOB ---
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    permissions:
      contents: read
      deployments: write
    steps:
      # 1. NEW: Download Source Code (Crucial for 'functions' folder)
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Download the Built Site (Contains your .well-known/assetlinks.json)
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          # This downloads the site to a folder named '_site' in the current directory
          path: ./_site
          
      # 3. Deploy (with automatic retry for transient Cloudflare API errors)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} 
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
          # Wrangler will automatically find the 'functions' folder in the root
          # and deploy it alongside the './_site' static assets
          command: pages deploy ./_site --project-name=tmp-host-urdu

      - name: Wait before retry on Cloudflare API error
        if: steps.deploy1.outcome == 'failure'
        run: sleep 10

      - name: Deploy to Cloudflare Pages (Retry)
        if: steps.deploy1.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} 
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
          command: pages deploy ./_site --project-name=tmp-host-urdu