name: Submit to IndexNow

on:
  workflow_run:
    workflows: ["Build and Deploy to Cloudflare Pages"]
    types: [completed]

jobs:
  submit-sitemap:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Submit sitemap URLs to IndexNow (Bing + Yandex + others)
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://theurdupost.tmpnews.com/sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY || '0d40c7a426aa46d581741c6b86598d71' }}

      - name: 🚀 Submit news-sitemap URLs to IndexNow
        uses: bojieyang/indexnow-action@v2
        with:
          sitemap-location: 'https://theurdupost.tmpnews.com/news-sitemap.xml'
          key: ${{ secrets.INDEXNOW_KEY || '0d40c7a426aa46d581741c6b86598d71' }}

      - name: 🚀 Direct IndexNow API Push (Bing & IndexNow Engines)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "theurdupost.tmpnews.com",
              "key": "0d40c7a426aa46d581741c6b86598d71",
              "keyLocation": "https://theurdupost.tmpnews.com/0d40c7a426aa46d581741c6b86598d71.txt",
              "urlList": [
                "https://theurdupost.tmpnews.com/",
                "https://theurdupost.tmpnews.com/sitemap.xml",
                "https://theurdupost.tmpnews.com/news-sitemap.xml"
              ]
            }'
          echo "Direct IndexNow submission completed."