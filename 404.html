<div class="content-wrapper" style="text-align: center; padding: 4rem 1.5rem; max-width: 720px; margin: 0 auto; direction: rtl;">
    <div style="font-size: 4rem; font-weight: 800; color: #dc2626; margin-bottom: 0.5rem;">404</div>
    <h1 style="font-size: 1.85rem; font-weight: 700; margin-bottom: 1rem; color: #1e293b;">مضمون مقامی طور پر دستیاب نہیں ہے</h1>
    <p id="local-redirect-status" style="font-size: 1rem; color: #64748b; line-height: 1.6; margin-bottom: 2rem;">
        درخواست کردہ صفحہ مقامی فائل سسٹم میں موجود نہیں ہے۔ لائیو ویب سائٹ پر پرانے مضامین Cloudflare D1 آرکائیو سے پیش کیے جاتے ہیں۔
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a id="live-article-btn" href="https://theurdupost.tmpnews.com" class="explore-hub-btn" style="display: none;">
            <i class="fas fa-external-link-alt ml-1"></i> لائیو The Urdu Post پر کھولیں
        </a>
        <a href="{{ '/' | relative_url }}" class="explore-hub-btn" style="background: #475569;">
            <i class="fas fa-home ml-1"></i> ہوم پیج پر واپس جائیں
        </a>
    </div>
</div>

<script>
(function() {
    const path = window.location.pathname;
    const isLocal = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || 
                    /^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname);

    if (isLocal && path.startsWith('/news/')) {
        const liveUrl = 'https://theurdupost.tmpnews.com' + path;
        const statusEl = document.getElementById('local-redirect-status');
        const liveBtn = document.getElementById('live-article-btn');
        if (statusEl) {
            statusEl.innerHTML = 'یہ مضمون Cloudflare D1 آرکائیو میں محفوظ ہے۔ لائیو ویب سائٹ <strong>theurdupost.tmpnews.com</strong> پر منتقل کیا جا رہا ہے...';
        }
        if (liveBtn) {
            liveBtn.href = liveUrl;
            liveBtn.style.display = 'inline-flex';
        }
        setTimeout(() => {
            window.location.replace(liveUrl);
        }, 1200);
    }
})();
</script>
