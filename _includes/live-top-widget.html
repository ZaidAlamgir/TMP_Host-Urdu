<script>
(function() {
    // Endpoints: In local development, probe local backend; in production, use production API only
    const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    const BASE_URLS = isLocal ? [
        'http://127.0.0.1:8000',
        'http://localhost:8000',
        'https://api.tmpnews.com'
    ] : [
        'https://api.tmpnews.com'
    ];

    const widget = document.getElementById('tmp-live-top-widget');
    const titleEl = document.getElementById('tmp-live-event-title');
    const tallyEl = document.getElementById('tmp-live-tally-summary');
    const barTrack = document.getElementById('tmp-live-bar-track');
    const tickerText = document.getElementById('tmp-live-ticker-text');
    
    if (!widget) return;

    let activeBaseUrl = null;
    let milestoneList = [];
    let milestoneIdx = 0;
    let rotateInterval = null;

    // 1. Probe server status with strict timeout (1500ms)
    async function probeServer() {
        for (const base of BASE_URLS) {
            try {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), 1500);
                const res = await fetch(`${base}/api/status`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: controller.signal
                });
                clearTimeout(timer);
                if (res.ok) {
                    const statusData = await res.json();
                    if (statusData && statusData.server_alive) {
                        activeBaseUrl = base;
                        return statusData;
                    }
                }
            } catch (err) {
                // Server down or unreachable, continue checking next
            }
        }
        return null;
    }

    // 2. Fetch live election ticker & milestones
    async function loadLiveContent(statusData) {
        if (!activeBaseUrl) return;

        try {
            // Fetch Ticker Summary
            const tickerRes = await fetch(`${activeBaseUrl}/api/election-update/ticker`);
            if (tickerRes.ok) {
                const tickerData = await tickerRes.json();
                renderTicker(tickerData);
            }

            // Fetch Milestones
            const msRes = await fetch(`${activeBaseUrl}/api/election-update/live-updates?limit=6`);
            if (msRes.ok) {
                milestoneList = await msRes.json();
                startMilestoneRotation();
            }

            // Reveal widget smoothly
            widget.style.display = 'block';
            widget.setAttribute('aria-hidden', 'false');
        } catch (e) {
            console.warn('[TMP Live Widget] Error loading live content:', e);
            // If error, keep hidden
            widget.style.display = 'none';
        }
    }

    function renderTicker(data) {
        if (!data) return;
        if (titleEl && data.event_title) titleEl.textContent = data.event_title;
        if (tallyEl && data.tally_summary) tallyEl.textContent = data.tally_summary;

        // Render Tally Progress Bar
        if (barTrack && data.top_alliances && Array.isArray(data.top_alliances)) {
            barTrack.innerHTML = '';
            const totalDeclared = data.top_alliances.reduce((sum, a) => sum + (a.total || 0), 0) || 1;
            
            const allianceColorMap = {
                'NDA': '#F97316',
                'INDIA': '#3B82F6',
                'TVK': '#BE185D',
                'SPA': '#CA8A04',
                'LDF': '#DC2626',
                'UDF': '#10B981',
                'Others': '#9CA3AF'
            };

            data.top_alliances.forEach(al => {
                const seg = document.createElement('div');
                seg.className = 'tmp-live-bar-segment';
                const pct = ((al.total / totalDeclared) * 100).toFixed(1);
                seg.style.width = `${pct}%`;
                seg.style.backgroundColor = al.color || allianceColorMap[al.name] || '#9CA3AF';
                seg.title = `${al.name}: ${al.total} (${pct}%)`;
                barTrack.appendChild(seg);
            });
        }
    }

    function startMilestoneRotation() {
        if (!tickerText || !milestoneList || milestoneList.length === 0) return;
        if (rotateInterval) clearInterval(rotateInterval);

        function showNext() {
            if (milestoneList.length === 0) return;
            const item = milestoneList[milestoneIdx % milestoneList.length];
            tickerText.style.opacity = '0';
            setTimeout(() => {
                tickerText.textContent = item.message;
                tickerText.style.opacity = '1';
            }, 200);
            milestoneIdx++;
        }

        showNext();
        rotateInterval = setInterval(showNext, 4500);
    }

    // Initialize Probe
    probeServer().then(statusData => {
        if (statusData && (statusData.election?.active || statusData.football_score?.active)) {
            loadLiveContent(statusData);
            // Periodic background refresh every 30s
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadLiveContent(statusData);
                }
            }, 30000);
        } else {
            // Server offline or no live event active -> Ensure widget is cleanly hidden
            widget.style.display = 'none';
        }
    }).catch(() => {
        widget.style.display = 'none';
    });
})();
</script>
