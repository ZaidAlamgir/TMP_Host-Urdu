---
layout: default
title: رائے و اداریہ
permalink: /post.html
---

<style>
    /* Feed Layout */
    .feed-container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .page-title { font-family: 'Noto Nastaliq Urdu', 'Noto Sans Arabic', Tahoma, serif; font-size: 2rem; font-weight: 900; margin-bottom: 20px; border-bottom: 2px solid #f3f4f6; padding-bottom: 10px; }
    
    /* Card Design */
    .feed-card { direction: rtl; text-align: right;  
        display: flex; gap: 20px; background: white; border: 1px solid #e5e7eb; 
        border-radius: 12px; padding: 20px; margin-bottom: 20px; transition: box-shadow 0.2s;
    }
    .feed-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    
    .card-image { width: 160px; height: 110px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #f3f4f6; }
    .card-image img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-content { flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-tags { margin-bottom: 8px; }
    .card-tag { font-size: 0.7rem; font-weight: 700; color: #dc2626; text-transform: uppercase; background: #fee2e2; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
    
    .card-title { font-family: 'Noto Nastaliq Urdu', 'Noto Sans Arabic', Tahoma, serif; font-size: 1.25rem; font-weight: 700; line-height: 1.3; color: #111; margin-bottom: 6px; text-decoration: none; }
    .card-title:hover { color: #2563eb; }
    
    .card-excerpt { font-family: 'Noto Nastaliq Urdu', 'Noto Sans Arabic', Tahoma, sans-serif; font-size: 0.9rem; color: #6b7280; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-meta { margin-top: 12px; font-size: 0.8rem; color: #9ca3af; display: flex; align-items: center; gap: 10px; }
    .author-link { color: #4b5563; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 6px;}
    .author-link:hover { text-decoration: underline; }
    .author-avatar-small { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

    /* Loading State */
    .loader { text-align: center; padding: 40px; color: #9ca3af; }
    
    @media (max-width: 640px) {
        .feed-card { direction: rtl; text-align: right;  flex-direction: column; }
        .card-image { width: 100%; height: 180px; }
    }
</style>

<main>
    <div class="feed-container">
        <h1 class="page-title" style="direction:rtl;text-align:right;">رائے و اداریہ</h1>
        
        <div id="feed-list"></div>
    </div>
</main>

<script>
function getPostSkeletonHTML(count = 3) {
    let html = '<div class="skeleton-fade-wrapper" id="feed-skeleton-wrapper">';
    for (let i = 0; i < count; i++) {
        html += `
        <div class="skeleton-feed-card">
            <div class="skeleton-shimmer-box skeleton-card-img"></div>
            <div class="skeleton-card-body">
                <div>
                    <div class="skeleton-shimmer-box skeleton-pill-sm" style="width: 60px; height: 16px; margin-bottom: 8px;"></div>
                    <div class="skeleton-shimmer-box skeleton-line-title" style="width: 85%; height: 20px; margin-bottom: 8px;"></div>
                    <div class="skeleton-shimmer-box skeleton-line-desc" style="width: 95%;"></div>
                    <div class="skeleton-shimmer-box skeleton-line-desc-short" style="width: 75%;"></div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
                    <div class="skeleton-shimmer-box" style="width: 20px; height: 20px; border-radius: 50%;"></div>
                    <div class="skeleton-shimmer-box" style="width: 80px; height: 12px; border-radius: 3px;"></div>
                </div>
            </div>
        </div>`;
    }
    html += '</div>';
    return html;
}

(function preRenderPostCache() {
    try {
        const feedList = document.getElementById('feed-list');
        if (!feedList) return;
        const localCache = localStorage.getItem('tmp_feed_cache');
        if (localCache) {
            feedList.innerHTML = localCache;
        } else {
            feedList.innerHTML = getPostSkeletonHTML(3);
        }
    } catch(e) {}
})();

window.loadCommunityFeed = async () => {
    const feedList = document.getElementById('feed-list');
    if (!feedList) return; 

    const localCache = localStorage.getItem('tmp_feed_cache');
    if (!localCache && !document.getElementById('feed-skeleton-wrapper')) {
        feedList.innerHTML = getPostSkeletonHTML(3);
    }

    try {
        let writers = [];
        try {
            const wRes = await fetch('/assets/data/writers_db.json');
            if (wRes.ok) writers = await wRes.json();
        } catch(e) { console.warn("Could not load writer DB"); }

        const response = await fetch('/api/feed');
        if (!response.ok) throw new Error("Failed to load feed");
        
        const data = await response.json();
        const posts = data.posts || [];
        
        if (posts.length === 0) {
            feedList.innerHTML = '<div class="text-center py-10 text-gray-500">کوئی مضمون نہیں ملا۔ بعد میں چیک کریں۔</div>';
            return;
        }

        const newHtml = posts.map(post => {
            const cleanAuthor = post.author ? post.author.replace(/^By\s+/i, '').trim() : 'Staff';
            const writerInfo = writers.find(w => w.name === cleanAuthor) || {};
            const avatarUrl = writerInfo.image || '/assets/img/default-avatar.png';
            const authorSlug = cleanAuthor.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
            const titleSlug = post.slug ? post.slug : (post.title ? post.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '') : 'article');
            const postLink = `/opinion/${authorSlug}/${titleSlug}`;
            const dateStr = new Date(post.date).toLocaleDateString('ur', { month: 'short', day: 'numeric', year: 'numeric' });
            
            let tagsHtml = '';
            try {
                const tags = JSON.parse(post.tags || '[]');
                tags.slice(0, 2).forEach(t => tagsHtml += `<span class="card-tag">${t}</span>`);
            } catch(e) {}

            return `
            <article class="feed-card content-fade-in">
                ${post.image ? `
                <a href="${postLink}" class="card-image">
                    <img src="${post.image}" alt="${post.title}" loading="lazy">
                </a>` : ''}
                
                <div class="card-content">
                    <div>
                        <div class="card-tags">${tagsHtml}</div>
                        <a href="${postLink}" class="card-title">${post.title}</a>
                        <div class="card-excerpt">${post.subheadline || 'مکمل مضمون پڑھنے کے لیے کلک کریں...'}</div>
                    </div>
                    <div class="card-meta">
                        <a href="/opinion/${authorSlug}" class="author-link">
                            <img src="${avatarUrl}" class="author-avatar-small" onerror="this.style.display='none'">
                            ${cleanAuthor}
                        </a>
                        <span>•</span>
                        <span>${dateStr}</span>
                    </div>
                </div>
            </article>
            `;
        }).join('');
        
        const skeletonWrapper = document.getElementById('feed-skeleton-wrapper');
        if (skeletonWrapper) {
            skeletonWrapper.classList.add('fade-out');
            setTimeout(() => {
                feedList.innerHTML = newHtml;
                localStorage.setItem('tmp_feed_cache', newHtml);
            }, 180);
        } else {
            if (feedList.innerHTML !== newHtml) {
                feedList.innerHTML = newHtml;
            }
            localStorage.setItem('tmp_feed_cache', newHtml);
        }
        
    } catch (err) {
        console.error(err);
        if (!localCache && !document.querySelector('.feed-card')) {
            feedList.innerHTML = `<div class="text-center py-10 text-gray-500">No opinions found. Check back soon!</div>`;
        }
    }
};

document.addEventListener("DOMContentLoaded", window.loadCommunityFeed);
document.addEventListener("turbo:load", window.loadCommunityFeed);
if (document.readyState === 'complete' || document.readyState === 'interactive') {
    window.loadCommunityFeed();
}
</script>
