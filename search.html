<style>
    .search-container {
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        flex-grow: 1;
    }
    .search-header h1 {
        font-size: 2.5rem;
        font-weight: 900;
        margin-bottom: 1rem;
        color: #1c1e21;
    }
    .search-header h1 span {
        color: #0073e6;
    }
    .search-results-list {
        list-style: none;
        padding: 0;
    }
    .result-item {
        padding: 1.5rem 0;
        border-bottom: 1px solid #e5e7eb;
    }
    .result-item a {
        text-decoration: none;
    }
    .result-item-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: #1c1e21;
        margin-bottom: 0.5rem;
    }
    .result-item-title:hover {
        text-decoration: underline;
    }
    .result-item-snippet {
        font-size: 1rem;
        color: #606770;
        line-height: 1.6;
    }
    .result-item-date {
        font-size: 0.9rem;
        color: #8a8d91;
        margin-top: 0.75rem;
    }
    .no-results {
        font-size: 1.2rem;
        color: #606770;
        text-align: center;
        padding: 3rem 0;
    }
</style>

<div class="search-container">
    <header class="search-header">
        <h1>Search Results for: <span id="search-term"></span></h1>
    </header>
    
    <ul id="search-results-list" class="search-results-list">
        </ul>
    
    <p id="no-results" class="no-results" style="display: none;">
        No articles found matching your search.
    </p>
</div>

<script>
(function() {
    function initSearchPage() {
        // 1. Get the search query from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q');
        
        const searchTermEl = document.getElementById('search-term');
        const resultsListEl = document.getElementById('search-results-list');
        const noResultsEl = document.getElementById('no-results');

        if (!searchTermEl || !resultsListEl) return;

        if (!query) {
            searchTermEl.textContent = '""';
            if (noResultsEl) noResultsEl.style.display = 'block';
            return;
        }

        const searchTerm = query.toLowerCase().trim();
        searchTermEl.textContent = `"${query}"`;

        // 2. Fetch both active search.json and historical D1 archive search concurrently
        Promise.allSettled([
            fetch('/search.json').then(r => r.ok ? r.json() : []),
            fetch('/api/search?q=' + encodeURIComponent(searchTerm)).then(r => r.ok ? r.json() : { results: [] })
        ]).then(([localRes, archiveRes]) => {
            const localPosts = (localRes.status === 'fulfilled' && Array.isArray(localRes.value)) ? localRes.value : [];
            const archivePosts = (archiveRes.status === 'fulfilled' && archiveRes.value && Array.isArray(archiveRes.value.results)) ? archiveRes.value.results : [];

            // Filter local active posts
            const filteredLocal = localPosts.filter(post => {
                const title = (post.title || '').toLowerCase();
                const tags = (post.tags || '').toLowerCase();
                const subheadline = (post.subheadline || '').toLowerCase();
                const content = (post.content || '').toLowerCase();
                return title.includes(searchTerm) || 
                       tags.includes(searchTerm) ||
                       subheadline.includes(searchTerm) ||
                       content.includes(searchTerm);
            });

            // Merge & deduplicate by URL
            const seenUrls = new Set();
            const combinedResults = [];

            for (const post of filteredLocal) {
                const normUrl = (post.url || '').toLowerCase().replace(/\/$/, '');
                if (normUrl && !seenUrls.has(normUrl)) {
                    seenUrls.add(normUrl);
                    combinedResults.push(post);
                }
            }

            for (const post of archivePosts) {
                const normUrl = (post.url || '').toLowerCase().replace(/\/$/, '');
                if (normUrl && !seenUrls.has(normUrl)) {
                    seenUrls.add(normUrl);
                    combinedResults.push(post);
                }
            }

            // Sort newest first
            combinedResults.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

            // 3. Render the results
            if (combinedResults.length > 0) {
                resultsListEl.innerHTML = '';
                if (noResultsEl) noResultsEl.style.display = 'none';

                combinedResults.forEach(post => {
                    const postDate = new Date(post.date).toLocaleDateString('ur-PK', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    const snippet = post.subheadline || (post.content ? post.content.substring(0, 150) + '...' : '');

                    const li = document.createElement('li');
                    li.className = 'result-item';
                    li.innerHTML = `
                        <a href="${post.url}">
                            <h2 class="result-item-title">${post.title}</h2>
                            ${snippet ? `<p class="result-item-snippet">${snippet}</p>` : ''}
                            <p class="result-item-date">${postDate}</p>
                        </a>
                    `;
                    resultsListEl.appendChild(li);
                });
            } else {
                if (noResultsEl) noResultsEl.style.display = 'block';
            }
        }).catch(error => {
            console.error('Error fetching search data:', error);
            if (resultsListEl) resultsListEl.innerHTML = '<p style="color: red;">Could not load search results.</p>';
        });
    }

    document.addEventListener('turbo:load', initSearchPage);
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initSearchPage);
    } else {
        initSearchPage();
    }
})();
</script>
